<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Student Result Management System</h1>

    <div class="form">

        <input type="text" id="name" placeholder="Student Name">

        <input type="text" id="roll" placeholder="Roll Number">

        <input type="number" id="sub1" placeholder="Physics Marks">

        <input type="number" id="sub2" placeholder="Chemistry Marks">

        <input type="number" id="sub3" placeholder="Mathematics Marks">

        <input type="number" id="sub4" placeholder="Computer Science Marks">

        <input type="number" id="sub5" placeholder="English Marks">

        <button id="addBtn">Add Student</button>

    </div>

    <div class="searchBox">

        <input type="text" id="search" placeholder="Search by Roll Number">

        <button id="searchBtn">Search</button>

        <button id="showAllBtn">Show All</button>

        <button id="sortBtn">Sort by Percentage</button>

    </div>

    <table>

        <thead>

            <tr>

                <th>Name</th>
                <th>Roll</th>
                <th>Total</th>
                <th>Percentage</th>
                <th>Grade</th>
                <th>Result</th>
                <th>Action</th>

            </tr>

        </thead>

        <tbody id="studentTable">

        </tbody>

    </table>

</div>

<script src="script.js"></script>

</body>
</html>
